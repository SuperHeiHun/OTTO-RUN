<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no">
  <title>otto_run</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <script src="index.js"></script>
</head>

<body id="t" class="offline">
  <div id="messageBox" class="sendmessage">
    <h1 style="text-align: center;font-family: 'Open Sans', sans-serif;">点击屏幕或按下空格开始冲刺</h1>
    <div class="niokbutton" onclick="okbuttonsend()"></div>
  </div>
  <div id="main-frame-error" class="interstitial-wrapper">
    <div id="main-content">
      <div class="icon icon-offline" alt=""></div>
    </div>
    <div id="offline-resources">
      <img id="offline-resources-1x" src="assets/default_100_percent/100-offline-sprite.png">
      <img id="offline-resources-2x" src="assets/default_200_percent/200-offline-sprite.png">
    </div>
  </div>
</body>

<script>
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });

  document.addEventListener('copy', function (e) {
    e.preventDefault();
  });

  document.addEventListener('selectstart', function (e) {
    e.preventDefault();
  });

  document.addEventListener('cut', function (e) {
    e.preventDefault();
  });

  document.addEventListener('dragstart', function (e) {
    e.preventDefault();
  });
  document.onkeydown = function (evt) {
    evt = evt || window.event;
    if (evt.keyCode == 32) {
      var box = document.getElementById("messageBox");
      box.style.visibility = "hidden";
    }
  };
</script>

</html>
